name: comprobar que todo se rehace igual

# En cada subida, GitHub rehace todos los resultados desde los datos del repositorio, en Linux y con las versiones de
# requirements.txt, y falla si algún resultado dice otra cosa. En Linux, algunos números cambian en el último decimal
# (1e-16), así que se comparan con una tolerancia relativa de 1e-9 (scripts/comparar_con_tolerancia.py). Las figuras
# PNG no cuentan: sus píxeles dependen de las fuentes de cada sistema. Es el mismo comando que explica el README, en «Cómo repetirlo».
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehacer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rehacer todo (python scripts/rehacer_todo.py --comprobar)
        env:
          REHACER_EN_CI: "1"
        run: |
          # si falla, el final de la salida va también como anotación del error, para verlo sin iniciar sesión
          python scripts/rehacer_todo.py --comprobar 2>&1 | tee salida.txt; estado=${PIPESTATUS[0]}
          if [ "$estado" -ne 0 ]; then
            echo "::error title=rehacer_todo.py falló::$(tail -c 2500 salida.txt | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            exit "$estado"
          fi
          rm salida.txt
      - name: Los resultados dicen lo mismo (números iguales hasta 1e-9)
        run: python scripts/comparar_con_tolerancia.py
