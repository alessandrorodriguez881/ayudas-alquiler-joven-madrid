name: comprobar que todo se rehace igual

# En cada subida, GitHub rehace todos los resultados desde los datos del repositorio, en Linux y con las versiones de
# requirements.txt, con las pruebas de la calculadora, del servidor MCP y de las 7 páginas de la app: falla si algo se
# rompe. Después compara los resultados con los del repositorio (hechos en Windows) y enseña las diferencias.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehacer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # la ficha DCAT fecha cada fichero con su historial
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rehacer todo (python scripts/rehacer_todo.py --comprobar)
        env:
          REHACER_EN_CI: "1"
        run: |
          # si falla, el final de la salida va también como anotación del error, para verlo sin iniciar sesión
          python scripts/rehacer_todo.py --comprobar 2>&1 | tee salida.txt; estado=${PIPESTATUS[0]}
          if [ "$estado" -ne 0 ]; then
            echo "::error title=rehacer_todo.py falló::$(tail -c 2500 salida.txt | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            exit "$estado"
          fi
          rm salida.txt
      - name: Diferencias con los resultados del repositorio (informativo)
        # En Linux (17-nov) solo cambian cuatro números de análisis exploratorios, a partir de la quinta cifra: el ajuste de
        # las habitaciones y tres extremos de intervalos. Se enseñan como aviso en la página de la ejecución, sin parar
        continue-on-error: true
        run: python scripts/comparar_con_tolerancia.py
